<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rest Inn — Receipt Generator</title>
<style>
  :root { --green:#1E5B44; --dark:#1C3530; --bg:#f4f6f5; --card:#ffffff; --muted:#6b7a75; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:#222; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:var(--card); border-radius:14px; padding:22px 18px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
  h1 { font-size:20px; margin:0 0 4px; color:var(--dark); }
  .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--dark); margin:14px 0 6px; }
  input { width:100%; padding:13px 12px; font-size:16px; border:1.5px solid #d7dedb; border-radius:10px; background:#fff; }
  input:focus { outline:none; border-color:var(--green); }
  .row2 { display:flex; gap:10px; } .row2 > div { flex:1; }
  .btn { display:block; width:100%; padding:15px; margin-top:20px; font-size:17px; font-weight:700; color:#fff; background:var(--green); border:none; border-radius:12px; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .btn.ghost { background:#e8eeeb; color:var(--dark); margin-top:10px; }
  .hidden { display:none !important; }
  .saved-note { text-align:center; font-size:13px; color:var(--muted); margin-top:12px; min-height:18px; }
  /* ---- receipt ---- */
  #receipt { background:#fff; border-radius:14px; padding:28px 24px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
  #receipt .r-head { text-align:center; border-bottom:2px solid var(--dark); padding-bottom:14px; margin-bottom:16px; }
  #receipt .r-head h2 { margin:0; font-size:22px; color:var(--dark); }
  #receipt .r-head p { margin:4px 0 0; font-size:13px; color:var(--muted); }
  #receipt table { width:100%; border-collapse:collapse; font-size:15px; }
  #receipt td { padding:7px 0; vertical-align:top; }
  #receipt td.k { color:var(--muted); width:42%; }
  #receipt tr.total td { border-top:2px solid var(--dark); font-size:19px; font-weight:800; padding-top:12px; color:var(--dark); }
  #receipt .r-foot { text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
  @media print {
    body { background:#fff; }
    .wrap { display:none !important; }
    #print-area { display:block !important; }
    #receipt { box-shadow:none; border-radius:0; padding:0; }
  }
  #print-area { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Form -->
  <div class="card" id="form-screen">
    <h1>New Receipt</h1>
    <p class="sub">Fill the fields, then print. The receipt is saved automatically.</p>
    <label>Guest name</label>
    <input id="f-guest" placeholder="e.g. Jane Smith" autocomplete="off">
    <label>Department / Company</label>
    <input id="f-dept" placeholder="e.g. Tulsa Day Center" autocomplete="off">
    <label>Room number</label>
    <input id="f-room" placeholder="e.g. 204" autocomplete="off">
    <div class="row2">
      <div><label>Check-in</label><input id="f-in" type="date"></div>
      <div><label>Check-out</label><input id="f-out" type="date"></div>
    </div>
    <label>Total amount ($)</label>
    <input id="f-amount" type="number" min="0" step="0.01" placeholder="e.g. 350.00" inputmode="decimal">
    <button class="btn" id="btn-preview">Preview receipt</button>
  </div>

  <!-- Receipt preview -->
  <div class="hidden" id="preview-screen">
    <div id="receipt">
      <div class="r-head">
        <h2>Rest Inn</h2>
        <p>7475 E Admiral Pl, Tulsa, OK 74115<br>(918) 576-6096</p>
      </div>
      <table>
        <tr><td class="k">Receipt no.</td><td id="r-no"></td></tr>
        <tr><td class="k">Date issued</td><td id="r-date"></td></tr>
        <tr><td class="k">Guest</td><td id="r-guest"></td></tr>
        <tr><td class="k">Department</td><td id="r-dept"></td></tr>
        <tr><td class="k">Room</td><td id="r-room"></td></tr>
        <tr><td class="k">Check-in</td><td id="r-in"></td></tr>
        <tr><td class="k">Check-out</td><td id="r-out"></td></tr>
        <tr><td class="k">Nights</td><td id="r-nights"></td></tr>
        <tr class="total"><td>Room charges — total</td><td id="r-amount"></td></tr>
      </table>
      <div class="r-foot">Thank you for staying with us.</div>
    </div>
    <button class="btn" id="btn-print" style="margin-top:16px">Print &amp; save receipt</button>
    <div class="saved-note" id="saved-note"></div>
    <button class="btn ghost" id="btn-new">New receipt</button>
  </div>

</div>

<!-- print target gets a clone of the receipt -->
<div id="print-area"></div>

<script>
(function(){
  var SUPABASE_URL = 'https://vjaibkfckxauoxdsojfn.supabase.co/rest/v1/receipts';
  var SUPABASE_ANON = 'sb_publishable_yqOFCrP8mBYm32x2cUYFYg_eHMDWB18';

  function val(id){ return document.getElementById(id).value.trim(); }
  function fmtDate(s){
    if(!s) return '—';
    var p = s.split('-'); return p[1]+'/'+p[2]+'/'+p[0];
  }
  function money(n){ return '$' + Number(n).toFixed(2); }

  function receiptNo(){
    var today = new Date();
    var key = 'rir-seq-' + today.toISOString().slice(0,10);
    var n = parseInt(localStorage.getItem(key) || '0', 10) + 1;
    localStorage.setItem(key, n);
    var d = today.toISOString().slice(0,10).replace(/-/g,'');
    return 'RIR-' + d + '-' + String(n).padStart(3,'0');
  }

  var current = null;

  document.getElementById('btn-preview').addEventListener('click', function(){
    var guest=val('f-guest'), dept=val('f-dept'), room=val('f-room'),
        cin=val('f-in'), cout=val('f-out'), amt=val('f-amount');
    if(!guest || !amt){ alert('Guest name and total amount are required.'); return; }
    var nights=null;
    if(cin && cout){
      var ms = new Date(cout) - new Date(cin);
      if(ms>0) nights = Math.round(ms/86400000);
    }
    var today = new Date().toISOString().slice(0,10);
    current = {
      receipt_no: receiptNo(),
      date_issued: today,
      guest_name: guest,
      department: dept || null,
      room: room || null,
      check_in: cin || null,
      check_out: cout || null,
      nights: nights,
      amount: Number(amt)
    };
    document.getElementById('r-no').textContent = current.receipt_no;
    document.getElementById('r-date').textContent = fmtDate(today);
    document.getElementById('r-guest').textContent = guest;
    document.getElementById('r-dept').textContent = dept || '—';
    document.getElementById('r-room').textContent = room || '—';
    document.getElementById('r-in').textContent = fmtDate(cin);
    document.getElementById('r-out').textContent = fmtDate(cout);
    document.getElementById('r-nights').textContent = nights === null ? '—' : nights;
    document.getElementById('r-amount').textContent = money(amt);
    document.getElementById('saved-note').textContent = '';
    document.getElementById('form-screen').classList.add('hidden');
    document.getElementById('preview-screen').classList.remove('hidden');
    window.scrollTo(0,0);
  });

  function saveReceipt(data, done){
    try {
      fetch(SUPABASE_URL, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON,
          'Authorization': 'Bearer ' + SUPABASE_ANON,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(data)
      }).then(function(r){ done(r.ok); }).catch(function(){ done(false); });
    } catch(e){ done(false); }
  }

  document.getElementById('btn-print').addEventListener('click', function(){
    if(!current) return;
    var note = document.getElementById('saved-note');
    note.textContent = 'Saving…';
    saveReceipt(current, function(ok){
      note.textContent = ok ? '✓ Saved to the receipt log.' : 'Printed — save failed, check connection.';
      var area = document.getElementById('print-area');
      area.innerHTML = '';
      area.appendChild(document.getElementById('receipt').cloneNode(true));
      setTimeout(function(){ window.print(); }, 300);
    });
  });

  document.getElementById('btn-new').addEventListener('click', function(){
    ['f-guest','f-dept','f-room','f-in','f-out','f-amount'].forEach(function(id){
      document.getElementById(id).value='';
    });
    current = null;
    document.getElementById('preview-screen').classList.add('hidden');
    document.getElementById('form-screen').classList.remove('hidden');
    window.scrollTo(0,0);
  });
})();
</script>
</body>
</html>
